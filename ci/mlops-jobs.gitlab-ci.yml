# TRAINING-PHASE + PRIVACY ATTACKS on the classical model (AIC Day 1 taxonomy),
# plus the deck's model-side DEFENCE. `test:robustness` already covers the
# deployment-phase third of the attack taxonomy (evasion); this covers the other
# two — poisoning and privacy — and pins the adversarial-re-training contract
# (`app/ml/adversarial.py`), whose fast tests need no attack budget.
#
# BLOCKING, unlike test:robustness. The poisoning gates need only numpy, so they
# cannot silently skip: `importorskip("art")` sits inside the one test that
# needs ART instead of at module level, which is why there is no exit-code-5
# guard here. A skipped test still reports as a pass; a missing test reports as
# nothing at all, and this is a safety gate.

