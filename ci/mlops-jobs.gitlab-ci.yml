# Promptfoo (OpenAI, MIT) — LLM red-team regression on every push/PR.
# Promptfoo red-teams the APP, not a vendor model. Until 2026-09-15 the target
# was `openai:chat:gpt-4o-mini`, so the attacks never met the guardrail, the
# redaction or the agents — the job graded OpenAI's safety training and called
# it ours. The backend is now booted in-job (same recipe as test:e2e) and the
# config posts every attack to /api/triage/stream. OPENAI_API_KEY is still
# required, but only for promptfoo's own attack synthesis + grading; the
# backend runs with no provider and exercises the deterministic path.

# ML-model artifact scan — modelscan (ProtectAI): detects malicious code in
# serialized models (pickle/torch/keras deserialization attacks).  [AI-Security]
scan:modelscan:
  stage: security-scan
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^only\// && $CI_COMMIT_BRANCH !~ /[\/,]scan[:.]modelscan(,|$)/'  # only/<jobs> branch lists other jobs
      when: never
    - if: '$CAREROUTE_PYRIT_ONLY == "true"'  # security/pyrit: only the PyRIT job runs
      when: never
    - if: '$CAREROUTE_DEPLOY_ONLY == "true"'  # release/deploy: deploy path only
      when: never
    - when: on_success
  image: python:3.12-slim
  needs: ["train:model"]            # scan the REAL trained artifact, present via needs
  variables:
    CAREROUTE_MODEL_DIR: "$CI_PROJECT_DIR/backend/models"
  script:
    - pip install modelscan
    # Scope to the model directory (the released joblib + sidecar), NOT the whole
    # repo: `-p .` tried to parse 18k unrelated files and errored (exit 2) on a
    # non-model pickle. modelscan exits 0 (clean) / 1 (unsafe operators found);
    # both are tolerated here (allow_failure) — the verdict is in the report.
    - modelscan -p backend/models -r json -o modelscan.json || true
    - modelscan -p backend/models > modelscan.txt 2>&1 || true   # readable copy
  artifacts:
    paths: [modelscan.json, modelscan.txt]
    when: always
  allow_failure: true

# SBOM + AI-BOM — CycloneDX Software Bill of Materials for the Python + Node
# dependency graph, plus an AI-BOM that inventories the model artifact + its
# integrity hashes / metadata. A current SBOM is the supply-chain control that
# makes a newly-disclosed dependency CVE traceable, and is mapped to OWASP LLM
# Top-10 LLM03 (Supply-Chain Vulnerabilities) — a poisoned/compromised model or
# dependency is exactly what an AI-BOM + SBOM make auditable.  [AI-Security][LLM03]

# MODEL ARTIFACT — Fickling (Trail of Bits). scan:modelscan checks the model for
# known-unsafe operators; Fickling decompiles the PICKLE PROGRAM itself and can
# report what the payload would execute on load. The joblib is the one artifact
# this pipeline both produces and later loads in a server process, so it earns
# two independent checks.
scan:model-fickling:
  stage: security-scan
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^only\// && $CI_COMMIT_BRANCH !~ /[\/,]scan[:.]model\-fickling(,|$)/'  # only/<jobs> branch lists other jobs
      when: never
    - if: '$CAREROUTE_PYRIT_ONLY == "true"'  # security/pyrit: only the PyRIT job runs
      when: never
    - if: '$CAREROUTE_DEPLOY_ONLY == "true"'  # release/deploy: deploy path only
      when: never
    - when: on_success
  image: python:3.12-slim
  needs: ["train:model"]
  variables:
    CAREROUTE_MODEL_DIR: "$CI_PROJECT_DIR/backend/models"
  script:
    - pip install -q fickling
    - |
      found=0
      : > fickling.txt
      for f in backend/models/*.joblib backend/models/*.pkl; do
        [ -e "$f" ] || continue
        found=1
        echo "───── $f ─────" | tee -a fickling.txt
        python -m fickling --check-safety --json-output "$f.fickling.json" "$f" >/dev/null 2>&1 || true
        python - "$f" <<'PY' | tee -a fickling.txt
      import ast, sys
      from fickling.fickle import Pickled
      # Fickling's own verdict is LIKELY_UNSAFE for ANY non-stdlib import, so it
      # cannot gate a sklearn model. Gate on an allowlist of what a sklearn
      # artifact legitimately imports, plus Fickling's unsafe-import list.
      ALLOWED = ("numpy.", "sklearn.")
      def names(nodes):
          out = set()
          for n in nodes:
              if isinstance(n, ast.ImportFrom):
                  out |= {f"{n.module}.{a.name}" for a in n.names}
              elif isinstance(n, ast.Import):
                  out |= {a.name for a in n.names}
          return out
      with open(sys.argv[1], "rb") as fh:
          p = Pickled.load(fh)
      imports, unsafe = names(p.non_standard_imports()), names(p.unsafe_imports())
      bad = sorted((i for i in imports if not i.startswith(ALLOWED)), key=str) + sorted(unsafe)
      print(f"{len(p)} opcodes; interpretation error={p.has_interpretation_error}; "
            f"{len(imports)} non-standard imports; {len(unsafe)} unsafe")
      for i in sorted(imports | unsafe):
          print(("  DISALLOWED " if i in bad else "  ok ") + i)
      sys.exit(1 if bad or p.has_interpretation_error or p.has_invalid_opcode else 0)
      PY
      done
      if [ "$found" -eq 0 ]; then echo "no pickle artifacts found to analyse"; exit 1; fi
  artifacts:
    paths: [fickling.txt, backend/models/*.fickling.json]
    when: always
  allow_failure: true

# ── BUILD ────────────────────────────────────────────────────────────────────
# Frontend production bundle. Lives in `build` (a build artifact), NOT in `test`.
#
# NO `artifacts:` BLOCK, deliberately. It used to publish `frontend/dist` — a
# path Next.js has never written: `output: 'standalone'` (next.config.mjs) emits
# `frontend/.next/standalone` + `.next/static`. GitLab does not fail a job for an
# artifact path that matches nothing, it just logs a warning, so this "artifact"
# was empty for as long as it existed. Nothing consumes it either: no job has
# `needs: ["build:frontend"]`, and build:images runs `docker build frontend`,
# which recompiles the app inside the image from source. So the fix is to DROP
# the block rather than repoint it at `.next` — this job's value is as a
# compile GATE (a broken build fails the pipeline here), not as a producer.

# CONTAINER IMAGE SCAN — Trivy scans the BUILT images (OS packages + Python/Node
# libraries + secrets + image misconfig) for HIGH/CRITICAL CVEs. Scanning the
# exported tars means it inspects exactly what build:images produced. This is
# the container-layer complement to scan:trivy-fs (which scans the source tree).
# ── PII EGRESS GATE [AI-Security] ────────────────────────────────────────────
# "PII egress events = 0". app/redact.py masks identifiers at the INPUT
# boundary; this is the independent check on the other side — did an identifier
# nevertheless reach an artifact that LEAVES the trust boundary (the inference
# log, the HITL ground-truth log, the drift report, the executive report, every
# one of which is published as a CI artifact and downloaded by later jobs)?
#
# BLOCKING. For a clinical product this is the one scanner whose findings are
# never "review at leisure". The findings file carries MASKED excerpts only: a
# report that quoted the NRIC it caught would have re-published it into exactly
# the artifact store the gate exists to protect.
# Runs in the `report` stage, not `security-scan`: it audits artifacts that have
# already been PUBLISHED, and the executive report is one of them. A gate that
# ran before the thing it inspects exists would report "skipped" forever.
scan:pii-egress:
  stage: report
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^only\// && $CI_COMMIT_BRANCH !~ /[\/,]scan[:.]pii\-egress(,|$)/'  # only/<jobs> branch lists other jobs
      when: never
    - if: '$CAREROUTE_PYRIT_ONLY == "true"'  # security/pyrit: only the PyRIT job runs
      when: never
    - if: '$CAREROUTE_DEPLOY_ONLY == "true"'  # release/deploy: deploy path only
      when: never
    - when: on_success
  image: python:3.12-slim
  needs: ["monitor:evidently", "report:pdf"]
  variables:
    # Same locations report:pdf and monitor:evidently write to. Without these the
    # gate looks under backend/reports, finds nothing, and reports "skipped"
    # forever while appearing to run.
    CAREROUTE_MONITOR_DIR: "$CI_PROJECT_DIR/backend/monitoring"
    CAREROUTE_REPORT_DIR: "$CI_PROJECT_DIR/reports"
  script:
    - cd backend
    - pip install -r requirements.txt
    # presidio adds ML-based NER for names/addresses, which no regex catches.
    # Optional: absent, the gate runs its deterministic rules and says so.
    - pip install presidio-analyzer || echo "presidio unavailable; deterministic rules only"
    - python -m app.ml.pii_egress --out "$CI_PROJECT_DIR/pii-egress.json"
  artifacts:
    paths: [pii-egress.json]
    when: always

# ── NOTHING BELOW PRODUCTION SPENDS MONEY [AI-Security] ──────────────────────
# Asserts that this non-production environment holds no credential an AGENT
# could use to reach a live, paid or rate-limited service. CareRoute's agents
# reach OneMap (a shared free account whose password has already leaked into a
# chat once), the LLM provider, and Onyx.
#
# Scope is the whole design: CI PLUMBING credentials (SONAR_TOKEN, the pipeline
# trigger token, the MLflow token) are deliberately NOT covered — they belong to
# the pipeline, no agent can reach them, and they must be present for their jobs
# to work. A gate that fired on those would be wrong every run, and a gate
# that is wrong every run is one everybody learns to ignore.

# [MLOps] SHADOW DEPLOY (stub). Progressive-delivery strategy for a new model
# version: rather than a hard cut-over, the CANDIDATE model is loaded ALONGSIDE
# the live PRIMARY and receives a mirror of production traffic. Its output is
# only LOGGED/compared (never served to patients), so we measure the candidate's
# agreement, latency and red-flag recall on REAL traffic before promotion.
# Promotion strategy once shadow metrics clear:
#   * BLUE-GREEN — stand up the candidate as a full parallel "green" stack, flip
#     the router atomically, keep "blue" warm for instant rollback; or
#   * CANARY — shift 1% -> 5% -> 25% -> 100% of traffic to the candidate, with an
#     automated rollback if red-flag recall / latency SLOs regress.
# The joblib from train:model is the candidate; get_model() content-addresses the
# version, so primary vs candidate are unambiguous and rollback is a version pin.
deploy:shadow-model:
  stage: deploy
  image: python:3.12-slim
  needs: ["train:model"]
  variables:
    CAREROUTE_MODEL_DIR: "$CI_PROJECT_DIR/backend/models"
  # [MLOps] Pillar 5 — GitLab ENVIRONMENT. Tracks this deploy under a named
  # "staging" environment (Deploy -> Environments), giving deploy history and a
  # rollback target. The candidate is shadow-scored in staging before promotion.
  environment:
    name: staging
    deployment_tier: staging
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^only\// && $CI_COMMIT_BRANCH !~ /[\/,]deploy[:.]shadow\-model(,|$)/'  # only/<jobs> branch lists other jobs
      when: never
    - if: '$CAREROUTE_PYRIT_ONLY == "true"'  # security/pyrit: only the PyRIT job runs
      when: never
    - if: '$CAREROUTE_DEPLOY_ONLY == "true"'  # release/deploy: deploy path only
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      allow_failure: true
  script:
    - cd backend
    - pip install -r requirements.txt
    # Load the CANDIDATE alongside the primary and log (not serve) its verdict on
    # a canned probe — the shadow-scoring hook a real mirror-traffic deploy runs.
    - >
      python -c "from app.ml.model import get_model;
      m=get_model(); a=m.fairness();
      p=m.predict('crushing chest pain radiating to the arm','40-64','Male');
      print('CANDIDATE', a.get('modelVersion'), '| shadow-probe acuity=', p['acuity_code'],
      'conf=', p['confidence'], '| redFlagRecall=', a.get('redFlagRecall'))"
    - echo "Shadow scoring only — candidate NOT promoted. Compare vs primary, then blue-green/canary."

# [MLOps] Pillar 5 — PROMOTE TO PRODUCTION. Manual gate that promotes the shadow-
# validated candidate — but only after the CHAMPION-CHALLENGER GATE: the
# candidate's audited metrics (model_audit.json from train:model) must be at
# least as good as the current Production (champion) model's registry metrics,
# within a small tolerance. A candidate that regresses accuracy or the
# safety-critical red-flag recall FAILS the job — promotion is a decision made
# on evidence, not "latest wins". Then transitions the MLflow-registered
# `CareRouteTriageRF` to the "Production" stage (the Dev->Staging->Production
# model lifecycle the course teaches) and stands it up as the production
# environment. It records the champion's version (PREVIOUS_MODEL_VERSION,
# dotenv) so rollback:production can re-pin it if this release is reverted.
# The container rollout itself is deploy:push-images -> deploy:ecs.
# NOTE: MLflow >= 2.9 deprecates registry STAGES in favour of version ALIASES
# (`@production` via set_registered_model_alias). The stage lifecycle is kept
# here because it is the model the course teaches and GitLab's registry
# supports it; the alias call is the drop-in successor.

# [MLOps] Pillar 5 — PROMOTE TO PRODUCTION. Manual gate that promotes the shadow-
# validated candidate — but only after the CHAMPION-CHALLENGER GATE: the
# candidate's audited metrics (model_audit.json from train:model) must be at
# least as good as the current Production (champion) model's registry metrics,
# within a small tolerance. A candidate that regresses accuracy or the
# safety-critical red-flag recall FAILS the job — promotion is a decision made
# on evidence, not "latest wins". Then transitions the MLflow-registered
# `CareRouteTriageRF` to the "Production" stage (the Dev->Staging->Production
# model lifecycle the course teaches) and stands it up as the production
# environment. It records the champion's version (PREVIOUS_MODEL_VERSION,
# dotenv) so rollback:production can re-pin it if this release is reverted.
# The container rollout itself is deploy:push-images -> deploy:ecs.
# NOTE: MLflow >= 2.9 deprecates registry STAGES in favour of version ALIASES
# (`@production` via set_registered_model_alias). The stage lifecycle is kept
# here because it is the model the course teaches and GitLab's registry
# supports it; the alias call is the drop-in successor.
deploy:promote-production:
  stage: deploy
  image: python:3.12-slim
  needs: ["deploy:shadow-model", "train:model"]
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^only\// && $CI_COMMIT_BRANCH !~ /[\/,]deploy[:.]promote\-production(,|$)/'  # only/<jobs> branch lists other jobs
      when: never
    - if: '$CAREROUTE_PYRIT_ONLY == "true"'  # security/pyrit: only the PyRIT job runs
      when: never
    - if: '$CAREROUTE_DEPLOY_ONLY == "true"'  # release/deploy: deploy path only
      when: never
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
      allow_failure: true   # OPTIONAL manual gate — pipeline stays green; a human
                            # explicitly promotes to production, never auto-run.
  environment:
    name: production
    deployment_tier: production
  artifacts:
    paths: [backend/mlflow.db, backend/mlruns/]
    reports:
      dotenv: deploy.env
  script:
    - pip install -q -r backend/requirements.txt mlflow==3.16.1
    - touch deploy.env
    # CHAMPION = the model actually serving (live /api/fairness), because a
    # registry that lives in one pipeline's artifact never holds a previous
    # champion. The old step looked for MLFLOW_TRACKING_URI (never set in CI) and
    # the Stages API (removed in MLflow 3), so it always printed "skipped".
    - |
      python - <<'PY'
      import json, os, sys, urllib.request
      TOLERANCE = 0.005
      cand = json.load(open("backend/models/model_audit.json"))
      url = os.environ.get("CAREROUTE_APP_URL", "http://careroute-demo-alb-1032403210.ap-southeast-1.elb.amazonaws.com")
      try:
          with urllib.request.urlopen(f"{url}/api/fairness", timeout=20) as r:  # nosec B310  # fixed https/http app URL
              champ = json.load(r)
      except Exception as exc:
          print(f"champion unavailable ({exc}); release gates already enforced upstream")
          champ = {}
      print(f"candidate {cand.get('modelVersion')}: acc={cand['overallAccuracy']} recall={cand['redFlagRecall']}")
      print(f"champion  {champ.get('modelVersion')}: acc={champ.get('overallAccuracy')} recall={champ.get('redFlagRecall')}")
      with open("deploy.env", "a") as fh:
          print(f"PREVIOUS_MODEL_VERSION={champ.get('modelVersion', '')}", file=fh)
      for k in ("overallAccuracy", "redFlagRecall"):
          if isinstance(champ.get(k), (int, float)) and cand[k] < champ[k] - TOLERANCE:
              sys.exit(f"CHAMPION-CHALLENGER GATE FAILED: {k} {champ[k]} -> {cand[k]}")
      print("champion-challenger gate: PASSED")
      PY
    - cd backend && python -m app.ml.promote --show && python -m app.ml.promote && python -m app.ml.promote --show
    - echo "Model promoted. Ship the containers with deploy:push-images -> deploy:ecs."

# [MLOps] Pillar 5 — ROLLBACK. Most rollbacks need no job at all: while a
# rollout or its bake period is open, ECS reverts on its own (circuit breaker,
# or the infra repo's 5xx-rate alarm at canary.py's 1% — see careroute_ai_infra
# modules/careroute_stack/deploy_safety.tf). This job is for a release that got
# past that window and was found bad LATER.
#
# Two halves, one click:
#   1. CONTAINERS — scripts/deploy_ecs.sh rollback: rolls the services back
#      onto the PREVIOUS verified image tag (the release history deploy:ecs
#      keeps in SSM), checks the image still exists in ECR first, and waits
#      until ECS is serving it — the same path as deploy:ecs, so this job goes
#      red if the rollback itself does not hold. Set ROLLBACK_IMAGE_TAG when
#      running this job to pick a specific older tag.
#   2. MODEL REGISTRY — re-pin the version that was Production before this
#      pipeline's promotion (PREVIOUS_MODEL_VERSION from deploy:promote-production),
#      so the next champion-challenger gate compares against what is serving.
#
# Replaces `deploy:canary-production`, whose Prometheus-driven ramp could never
# run — GitLab's shared runners cannot reach an in-VPC Prometheus — and whose
# error-rate rule ECS now enforces from CloudWatch instead.

# [MLOps] Pillar 5 — ROLLBACK. Most rollbacks need no job at all: while a
# rollout or its bake period is open, ECS reverts on its own (circuit breaker,
# or the infra repo's 5xx-rate alarm at canary.py's 1% — see careroute_ai_infra
# modules/careroute_stack/deploy_safety.tf). This job is for a release that got
# past that window and was found bad LATER.
#
# Two halves, one click:
#   1. CONTAINERS — scripts/deploy_ecs.sh rollback: rolls the services back
#      onto the PREVIOUS verified image tag (the release history deploy:ecs
#      keeps in SSM), checks the image still exists in ECR first, and waits
#      until ECS is serving it — the same path as deploy:ecs, so this job goes
#      red if the rollback itself does not hold. Set ROLLBACK_IMAGE_TAG when
#      running this job to pick a specific older tag.
#   2. MODEL REGISTRY — re-pin the version that was Production before this
#      pipeline's promotion (PREVIOUS_MODEL_VERSION from deploy:promote-production),
#      so the next champion-challenger gate compares against what is serving.
#
# Replaces `deploy:canary-production`, whose Prometheus-driven ramp could never
# run — GitLab's shared runners cannot reach an in-VPC Prometheus — and whose
# error-rate rule ECS now enforces from CloudWatch instead.
rollback:production:
  stage: deploy
  image: python:3.12-slim
  needs: ["deploy:promote-production"]
  resource_group: ecs-deploy # never at the same time as a deploy:ecs rollout
  id_tokens:
    AWS_ID_TOKEN:
      aud: https://gitlab.com
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^only\// && $CI_COMMIT_BRANCH !~ /[\/,]rollback[:.]production(,|$)/'  # only/<jobs> branch lists other jobs
      when: never
    - if: '$CAREROUTE_PYRIT_ONLY == "true"'  # security/pyrit: only the PyRIT job runs
      when: never
    - if: '$CAREROUTE_DEPLOY_ONLY == "true"'  # release/deploy: deploy path only
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "release/deploy"'
      when: manual
      allow_failure: true
  environment:
    name: production
    deployment_tier: production
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends jq >/dev/null
    - pip install -q awscli
    - |
      if [ -n "${AWS_DEPLOY_ROLE_ARN:-}" ]; then
        printf '%s' "$AWS_ID_TOKEN" > /tmp/aws-web-identity-token
        export AWS_WEB_IDENTITY_TOKEN_FILE=/tmp/aws-web-identity-token
        export AWS_ROLE_ARN="$AWS_DEPLOY_ROLE_ARN" AWS_ROLE_SESSION_NAME="gitlab-rollback-${CI_JOB_ID}"
      fi
    - sh scripts/deploy_ecs.sh rollback "${ROLLBACK_IMAGE_TAG:-}"
    - pip install -q mlflow==3.16.1
    - |
      python - <<'PY'
      import os
      v = os.environ.get("PREVIOUS_MODEL_VERSION")
      if not (v and os.environ.get("MLFLOW_TRACKING_URI")):
          print("registry re-pin skipped: no previous Production version recorded, or MLflow unset")
      else:
          import mlflow
          c = mlflow.tracking.MlflowClient()
          c.transition_model_version_stage("CareRouteTriageRF", v, "Production",
                                           archive_existing_versions=True)
          print(f"re-pinned CareRouteTriageRF v{v} -> Production")
      PY

