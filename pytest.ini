[pytest]
testpaths = tests
markers =
    intake: Symptom-Intake agent (owner: Sham Goh)
    classifier: Severity-Classifier agent (owner: Koh Guan Chin James)
    safety: Safety-Override agent (owner: Aaron Liew)
    routing: Care-Routing agent (owner: Marcus Teh)
    hitl: Human-in-the-Loop agent (owner: Heriz Yusoff)
    handoff: Clinician-Handoff agent (owner: Heriz Yusoff)
    reflection: Reflection/Critic agent (owner: platform / James)
    observability: correlation IDs, log stamping and request tracing (owner: platform / James)
    contract: cross-agent contract / isolation-boundary tests
    comms: agent-to-agent messaging (bus + per-agent COMMS interface)
    capability: agent-vs-policy-node capability declarations (review Points 1 & 3)
    eval: agent + system evaluation plan and its gold datasets (review Point 2)
    safety_nlp_artifact: opt-in Safety NLP tests that load local model artifacts; requires RUN_SAFETY_NLP_ARTIFACT_TESTS=1
    integration: opt-in live external-provider test; requires RUN_LIVE_ROUTING_TESTS=1
